var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil

/* ======================= sales history ======================= */
R.sa=()=>`<div class=kpis id=sak></div><div class=card><div class=tb><div class=search>${ic('search')}<input id=sq value="${e(sq)}" placeholder="Chek raqami yoki mijoz" oninput="sq=this.value;sal()"></div><input type=date id=sd value="${sd}" style="width:auto" onchange="sd=this.value;sal()"><button class="btn ghost" onclick="sq='';sd='';go('sa')">${ic('reset',16)}Tozalash</button></div><div class=tw id=saw></div></div>`;
function sal(){const q=sq.toLowerCase(),r=S.sa.filter(s=>(!sd||dkey(s.d)==sd)&&(!q||String(s.no).includes(q)||s.cu.toLowerCase().includes(q))).reverse(),rv=r.filter(s=>!s.ret),t=rv.reduce((a,s)=>a+s.tot,0);
$('#sak').innerHTML=kpi('Cheklar',r.length+'<span>ta</span>','rc')+kpi('Savdo summasi',sumH(t),'trend','hero')+kpi('Foyda',sumH(rv.reduce((a,s)=>a+s.pr,0)),'up','g')+kpi('Qarzga',sumH(rv.reduce((a,s)=>a+(s.qarz||0),0)),'debt','rd');
$('#saw').innerHTML=r.length?`<table><thead><tr><th>Chek<th>Sana<th>Kassir<th>Mijoz<th>Turi<th class=r>Naqd<th class=r>Plastik<th class=r>Qarz<th class=r>Jami<th></tr></thead><tbody>${r.slice(0,300).map(s=>`<tr style="cursor:pointer" onclick="showPrint(${s.no},'${s.typ=='opt'?'opt':'k'}')"><td><b>№${s.no}</b>${s.ret?' <span class="badge er">qaytarilgan</span>':''}<td class=mu>${new Date(s.d).toLocaleString('ru-RU')}<td>${e(s.u)}<td>${e(s.cu)}<td><span class="badge ${s.typ=='opt'?'ac':''}">${s.typ=='opt'?'Optom':'Chakana'}</span><td class=r>${f(s.naqd)}<td class=r>${f(s.karta)}<td class="r ${s.qarz?'cr':'mu'}">${f(s.qarz)}<td class=r><b>${f(s.tot)}</b><td class=act><button class="btn sm ghost icon">${ic('print',16)}</button>`).join('')}</tbody></table>`:empty('rc','Cheklar topilmadi',sd||sq?'Filtrni o‘zgartiring':'Hali savdo qilinmagan')}
/* ======================= settings ======================= */
let stRW='80';
R.st=()=>{const t=document.documentElement.getAttribute('data-theme')||'auto',C=S.cfg;stRW=C.rw;return`<div class=g2 style="grid-template-columns:1.2fr 1fr">
<div class=card><div class=card-h><h3>${ic('store',18)}Do'kon va chek</h3></div><div class=card-b><div class=fg>
<label class="fld s2"><span>Do'kon nomi</span><input id=sn value="${e(S.shop)}" oninput=stpv()></label>
<label class="fld s2"><span>Manzil</span><input id=sad value="${e(C.addr)}" oninput=stpv()></label>
<label class=fld><span>Telefon</span><input id=stel value="${e(C.tel)}" oninput=stpv()></label>
<label class=fld><span>STIR (INN)</span><input id=sinn value="${e(C.inn)}" inputmode=numeric placeholder=ixtiyoriy oninput=stpv()></label>
<label class="fld s2"><span>Chek ostidagi matn</span><textarea id=sft rows=2 oninput=stpv() style="font-family:inherit">${e(C.foot)}</textarea></label>
<div class=fld><span>Kassa cheki eni</span><div class=seg id=srw>${['58','80'].map(w=>`<button class="${C.rw==w?'on':''}" onclick="srw('${w}')">${w} mm</button>`).join('')}</div></div>
<label class=tgl style="align-self:end;padding-bottom:8px"><input type=checkbox id=sqr ${C.qr?'checked':''} onchange=stpv()> Chekda QR kod</label>
<div class=s2><button class="btn pri w" onclick=sts()>${ic('check')}Saqlash</button></div></div></div></div>
<div class=card><div class=card-h><h3>${ic('qr',18)}Chek ko'rinishi</h3><small>namuna</small></div><div class=card-b><div class=pvw><div class=paper id=stp></div></div></div></div></div>
<div class=g2 style="grid-template-columns:1fr 1fr"><div class=card><div class=card-h><h3>${ic('cash',18)}Dollar kursi</h3></div><div class=card-b style="display:flex;flex-direction:column;gap:14px">
<div class=kbig>$1 = ${f(S.kurs)} <small class=mu>so'm</small></div><small class=mu style="margin-top:-8px">${e(kInfo())}</small>
<label class=tgl><input type=checkbox ${C.autoK?'checked':''} onchange="S.cfg.autoK=this.checked;save();autoK();shell()"> Har 30 daqiqada Markaziy bankdan avtomatik yangilansin</label>
<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><label class=fld style="flex:1;min-width:140px"><span>Qo'lda kiritish</span><input id=sk type=number inputmode=decimal value="${S.kurs}"></label><button class="btn soft" onclick="setKurs($('#sk').value)">Saqlash</button><button class="btn pri" onclick=fetchKurs(1)>${ic('reset',16)}Hozir yangilash</button></div>
<small class=mu>Avtomatik rejim yoqiq bo'lsa, qo'lda kiritilgan kurs keyingi yangilanishda almashtiriladi.</small></div></div>
<div class=card><div class=card-h><h3>${ic('lock',18)}PIN kodlar</h3></div><div class=card-b><div class=fg>
<label class=fld><span>Yangi admin PIN</span><input id=pa type=password inputmode=numeric maxlength=8 placeholder="••••" autocomplete=new-password></label><label class=fld><span>Yangi kassir PIN</span><input id=pkx type=password inputmode=numeric maxlength=8 placeholder="••••" autocomplete=new-password></label>
<small class="mu s2">4–8 ta raqam. Bo'sh qoldirilgan PIN o'zgarmaydi.</small><div class=s2><button class="btn pri w" onclick=spw()>${ic('check')}PIN'ni saqlash</button></div></div></div></div></div>
<div class=g2 style="grid-template-columns:1fr 1fr"><div class=card><div class=card-h><h3>${ic('sun',18)}Ko'rinish</h3></div><div class=card-b><div class=sw><div><b>Mavzu</b><small>Yorug', qorong'i yoki tizim bo'yicha</small></div><div class=seg>${[['auto','Avto'],['light',"Yorug'"],['dark',"Qorong'i"]].map(o=>`<button class="${t==o[0]?'on':''}" onclick="setTheme('${o[0]}')">${o[1]}</button>`).join('')}</div></div>
<div class=sw><div><b>Klaviatura</b><small>F2 qidiruv · F4 to'lov · F9 kutish · Esc yopish</small></div></div></div></div>
<div class=card><div class=card-h><h3>${ic('shield',18)}Zaxira nusxa</h3></div><div class=card-b><p class=mu style="margin-top:0">Ma'lumotlar shu kompyuterda saqlanadi. Muntazam ravishda faylga zaxira oling.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" onclick=bkDl()>${ic('dl',16)}Faylga yuklab olish</button><label class="btn soft">${ic('ul',16)}Fayldan tiklash<input type=file accept=".json,application/json" hidden onchange=bkUl(this)></label></div></div></div></div>
<div class="card dz" style="margin-top:18px"><div class=card-b style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b class=cr>Xavfli zona</b><br><small>Barcha ma'lumot o'chadi va demo ma'lumot qaytadi.</small></div><button class="btn dan" onclick=rst()>${ic('reset',16)}Demo ma'lumotni qayta yuklash</button></div></div>`};
function srw(w){stRW=w;$$('#srw button').forEach((b,i)=>b.classList.toggle('on',['58','80'][i]==w));stpv()}
function stpv(){const el=$('#stp');if(!el)return;const o=[S.shop,S.cfg];S.shop=$('#sn').value||S.shop;S.cfg=Object.assign({},S.cfg,{addr:$('#sad').value,tel:$('#stel').value,inn:$('#sinn').value,foot:$('#sft').value,rw:stRW,qr:$('#sqr').checked});
const last=[...S.sa].reverse().find(x=>!x.ret);el.innerHTML=rcp(last||{no:S.uid+1,d:new Date().toISOString(),u:U.n,cu:'Ommaviy',typ:'ret',li:[{n:'PPR quvur 20mm (4m)',un:'dona',q:2,p:20200},{n:'Shar kran 1/2',un:'dona',q:1,p:38100},{n:'Teflon lenta',un:'dona',q:3,p:4800}],disc:0,tot:92900,naqd:92900,karta:0,qarz:0,qay:7100,kurs:S.kurs},'k');[S.shop,S.cfg]=o}
function sts(){S.shop=$('#sn').value.trim()||S.shop;Object.assign(S.cfg,{addr:$('#sad').value.trim(),tel:$('#stel').value.trim(),inn:$('#sinn').value.trim(),foot:$('#sft').value.trim(),rw:stRW,qr:$('#sqr').checked});save();shell();toast('Sozlamalar saqlandi','ok')}
function spw(){const a=$('#pa').value,k=$('#pkx').value,ok=v=>/^\d{4,8}$/.test(v);if(!a&&!k)return toast('Yangi PIN kiriting','er');if((a&&!ok(a))||(k&&!ok(k)))return toast("PIN 4–8 ta raqamdan iborat bo'lishi kerak",'er');if(a&&k&&a==k)return toast("Admin va kassir PIN'i bir xil bo'lmasin",'er');
if(a)S.pw.admin=a;if(k)S.pw.kassir=k;save();$('#pa').value=$('#pkx').value='';toast("PIN kodlar saqlandi",'ok')}
function bkDl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='santexpos-'+dkey(Date.now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Zaxira fayl yuklandi','ok')}
function bkUl(inp){const fl=inp.files[0];if(!fl)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!d.it||!d.sh)throw 0;if(!await ask('Joriy ma’lumotlar fayldagi bilan almashtiriladi.',{t:'Tiklash',ok:'Tiklash',danger:true}))return;S=d;mig();save();shell();toast('Ma’lumotlar tiklandi','ok')}catch(x){toast("Fayl noto'g'ri",'er')}};rd.readAsText(fl);inp.value=''}
async function rst(){if(await ask("Hamma ma'lumot o'chib, demo ma'lumot qaytadi. Bu amalni qaytarib bo'lmaydi.",{t:"Ma'lumotlarni tozalash",ok:"Ha, o'chirish",danger:true})){S=seed();mig();held=[];resetSale();save();shell();toast('Demo ma’lumot yuklandi','ok')}}
/* ======================= keyboard ======================= */
document.addEventListener('keydown',x=>{const m=topM();
if(x.key=='Escape'){if(m){x.preventDefault();closeM(m)}else if($('.cartp.open'))sheet(0);return}
if(!U){if(/^\d$/.test(x.key))pk(x.key);else if(x.key=='Backspace')pk('B');else if(x.key=='Enter')doLogin();return}
if(m){if(x.key=='Enter'&&['INPUT','SELECT'].includes(x.target.tagName)){const ok=m.querySelector('.ok');if(ok){x.preventDefault();ok.click()}}return}
if(x.key=='F2'){x.preventDefault();if(pg!='pos')go('pos');$('#q').focus();$('#q').select()}
if(x.key=='F4'&&pg=='pos'){x.preventDefault();pay()}
if(x.key=='F9'&&pg=='pos'){x.preventDefault();hold()}});
login();
</script>

</body></html>
